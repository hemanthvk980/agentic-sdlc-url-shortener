name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build & test (Java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # Unit + integration tests, the three offline orchestrator scenarios (end-to-end),
      # ArchUnit rules, coverage gate. Testcontainers PostgreSQL test runs (Docker is available on ubuntu-latest).
      - run: ./gradlew build --no-daemon
      - name: Verify committed audit logs are intact
        run: |
          for f in runs/*/audit.jsonl; do
            [ -f "$f" ] || continue
            ./gradlew -q :orchestrator-core:run --args="verify-audit $f" --no-daemon
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: "**/build/reports/"

  web:
    name: Build web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run build

  image:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [build, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t url-shortener:ci .

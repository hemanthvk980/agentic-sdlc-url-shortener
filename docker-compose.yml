# Local production-like stack: PostgreSQL + the app image.
#   docker compose up --build        → http://localhost:8080
# Credentials below are for local development only.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shortener
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-shortener}
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_NAME: shortener
      DATABASE_USERNAME: shortener
      DATABASE_PASSWORD: ${LOCAL_DB_PASSWORD:-shortener}
      APP_BASE_URL: http://localhost:8080
      APP_ADMIN_API_KEY: ${APP_ADMIN_API_KEY:-}
    ports: ["8080:8080"]
